<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Track</title><link rel="stylesheet" href="/style.css">
<main class="workspace debug-collapsed">
<section id="debug-panel" class="product" aria-label="被监测产品" hidden><div class="panel-heading">被监测产品</div><div class="phone-stage"><div class="phone-device"><div class="phone-screen"><iframe id="product-frame" title="可操作的手机语音产品"></iframe></div></div></div></section>
<section class="analysis" aria-labelledby="analysis-title"><div class="panel-heading tool-nav"><h1 id="analysis-title">Track Track</h1><button id="debug-toggle" type="button" aria-controls="debug-panel" aria-expanded="false">展开调试产品</button></div><div class="tool-tabs" role="tablist" aria-label="工具模块"><button id="raw-tab" role="tab" aria-selected="true" aria-controls="raw-view">热力图</button><button id="insights-tab" role="tab" aria-selected="false" aria-controls="insights-view" tabindex="-1">轨迹分析</button><button id="dashboard-tab" role="tab" aria-selected="false" aria-controls="dashboard-view" tabindex="-1">数据看板</button></div><section class="analysis-panel" aria-label="监测数据"><div class="range-controls"><span class="range-label">时间范围</span><button id="range-toggle" aria-expanded="false" aria-controls="range-popover">📅 <span id="date">日期</span></button><div id="range-popover" hidden><label>开始日期<input id="range-start" type="date"></label><label>截止日期<input id="range-end" type="date"></label><div id="range-error" role="alert"></div><div class="range-actions"><button id="range-cancel" type="button">取消</button><button id="range-apply" type="button">确定</button></div></div></div><div class="work-panels"><div id="monitor-preview"><div class="preview-heading"><h3 id="preview-title">页面预览</h3><label class="heat-control"><input id="show-heat" type="checkbox" checked><span>显示热力图</span></label></div><div class="phone-stage mirror-preview"><div class="phone-device"><div class="phone-screen product-preview"><iframe id="heat-frame" title="手机产品界面副本" tabindex="-1" sandbox="allow-same-origin allow-scripts"></iframe><div id="heat-overlay"></div></div></div></div><div id="replay-status" role="status" hidden></div></div><div id="raw-view" role="tabpanel" aria-labelledby="raw-tab"><div class="analysis-body">
<h3 class="panel-title">原始数据</h3>
<table><thead><tr><th>组件 / 事件</th><th>用户唯一标识</th><th>事件数据</th><th>期间次数</th><th>人数</th><th>最近点击</th></tr></thead><tbody id="metrics"></tbody></table>


</div></div><div id="insights-view" role="tabpanel" aria-labelledby="insights-tab" hidden><div class="insights-body"><section id="trajectory-panel" aria-label="轨迹记录"></section></div></div></div></section><div id="dashboard-view" role="tabpanel" aria-labelledby="dashboard-tab" hidden><div class="insights-body"><section class="insight-section"><h3>数据看板</h3><div id="dashboard-content"></div></section></div></div></section>
</main><script src="/analysis-metrics.js" defer></script><script src="/app.js" defer></script></html>
