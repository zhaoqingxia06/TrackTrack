<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声记 · 语音转文字 Demo</title><link rel="stylesheet" href="./product.css"></head>
<body><div class="mobile-app"><div class="status-bar" aria-hidden="true"><span class="status-time">9:41</span><span class="camera-pill"></span><div class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi">◔</span><span class="battery"></span></div></div><main class="voice-app">
<header class="product-toolbar"><div class="tabs" role="tablist" aria-label="内容类型"><button id="transcript-tab" type="button" role="tab" aria-selected="true" aria-controls="transcript-panel">转写</button><button id="summary-tab" type="button" role="tab" aria-selected="false" aria-controls="summary-panel">摘要</button></div><button id="save-content" type="button" hidden>保存</button></header>
<div class="content-area">
<section id="transcript-panel" role="tabpanel" aria-labelledby="transcript-tab"><div id="transcript-empty" class="empty"><span class="sound-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><h2>把想法说出来</h2><p>点击下方按钮，查看语音转文字的演示。</p></div><div id="transcript-content" hidden><p class="content-label">转写内容 <span>示例文字</span></p><p class="transcript">我们先做一个简单的语音转文字产品。顶部可以切换转写和摘要，中间展示内容，底部控制识别的开启和关闭。</p><p class="transcript">先把这几个交互跑通，其他功能之后再慢慢增加。</p></div></section>
<section id="summary-panel" role="tabpanel" aria-labelledby="summary-tab" hidden><div id="summary-empty" class="empty"><span class="sound-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><h2>让重点更清晰</h2><p>开始识别后，这里会展示演示摘要。</p></div><div id="summary-content" hidden><p class="content-label">内容摘要 <span>示例文字</span></p><h2 class="summary-title">先验证一个简单的语音产品</h2><ul><li>支持转写与摘要两个视图。</li><li>识别按钮可以开始和关闭。</li><li>先验证交互，再逐步增加功能。</li></ul></div></section>
</div>
